name: Auto Patch & Release APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'  # UTC 15:00 (日本時間 00:00)

jobs:
  patch_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Get latest Piko release and APK info from GitHub
        id: get_release_piko_and_origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # /releases/latest は pre-release を除外するため使用しない。
          # /releases から draft 以外を新しい順に確認し、
          # 無印 twitter-piko APK を含む最初の Release を採用する。
          PIKO_RELEASES=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/monsivamon/twitter-apk/releases?per_page=30")

          PIKO_RELEASE=$(echo "$PIKO_RELEASES" | jq -c '
            [
              .[]
              | select(.draft == false)
              | . as $release
              | [
                  .assets[]?
                  | select(
                      (.name | test("^twitter-piko-v[0-9].*\\.apk$"))
                      and ((.name | contains("material-you")) | not)
                    )
                ] as $assets
              | select(($assets | length) > 0)
              | {
                  tag_name: $release.tag_name,
                  prerelease: $release.prerelease,
                  asset: $assets[0]
                }
            ][0]
          ')

          if [ -z "$PIKO_RELEASE" ] || [ "$PIKO_RELEASE" = "null" ]; then
            echo "❌ No release containing a non-Material-You twitter-piko APK was found."
            exit 1
          fi

          PIKO_RELEASE_TAG=$(echo "$PIKO_RELEASE" | jq -r '.tag_name')
          PIKO_PRERELEASE=$(echo "$PIKO_RELEASE" | jq -r '.prerelease')
          PIKO_ASSET_NAME=$(echo "$PIKO_RELEASE" | jq -r '.asset.name')
          PIKO_ASSET_URL=$(echo "$PIKO_RELEASE" | jq -r '.asset.browser_download_url')

          # 例:
          #   PIKO_RELEASE_TAG: piko-v3.9.0-dev.9
          #   asset: twitter-piko-v12.17.0-release.0.apk
          #   APK_VERSION: 12.17.0-release.0
          APK_VERSION="${PIKO_ASSET_NAME#twitter-piko-v}"
          APK_VERSION="${APK_VERSION%.apk}"

          echo "PIKO_RELEASE_TAG=$PIKO_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PIKO_PRERELEASE=$PIKO_PRERELEASE" >> "$GITHUB_ENV"
          echo "PIKO_ASSET_NAME=$PIKO_ASSET_NAME" >> "$GITHUB_ENV"
          echo "PIKO_ASSET_URL=$PIKO_ASSET_URL" >> "$GITHUB_ENV"
          echo "APK_VERSION=$APK_VERSION" >> "$GITHUB_ENV"

          echo "✅ Upstream release: $PIKO_RELEASE_TAG (prerelease=$PIKO_PRERELEASE)"
          echo "✅ Selected APK: $PIKO_ASSET_NAME"
          echo "✅ APK version: $APK_VERSION"

          # /releases/latest は pre-release を除外するため使用しない
          ORIGIN_RELEASES=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YuzuMikan404/Origin-Twitter-Neo/releases?per_page=30" || echo "[]")

          YuzuMikan404_TAG=$(echo "$ORIGIN_RELEASES" | jq -r '[.[] | select(.draft == false)] | .[0].tag_name // empty')

          if [ -n "$YuzuMikan404_TAG" ]; then
            echo "YuzuMikan404_TAG=${YuzuMikan404_TAG}" >> "$GITHUB_ENV"
            echo "✅ Found existing release tag: $YuzuMikan404_TAG"
          else
            echo "ℹ️ No existing release found or API error."
            echo "YuzuMikan404_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Check if releases match
        id: check_releases
        run: |
          if [ -z "${{ env.YuzuMikan404_TAG }}" ]; then
            echo "No existing release found. Proceeding."
            echo "SKIP=false" >> "$GITHUB_ENV"
          elif [ "${{ env.PIKO_RELEASE_TAG }}" == "${{ env.YuzuMikan404_TAG }}" ]; then
            echo "Releases match. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "Releases differ. Proceeding."
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Install requests and PyYAML
        if: ${{ env.SKIP == 'false' }}
        run: pip install requests PyYAML

      - name: Install dependencies
        if: ${{ env.SKIP == 'false' }}
        run: |
          sudo apt-get update && sudo apt-get install -y curl wget jq unzip openjdk-17-jdk

      - name: Install Android SDK & Build Tools
        if: ${{ env.SKIP == 'false' }}
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk-tools.zip
          unzip sdk-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0"

      - name: Install latest Apktool
        if: ${{ env.SKIP == 'false' }}
        run: |
          set -euo pipefail
          APKTOOL_VERSION=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r .tag_name)
          echo "Installing Apktool version: $APKTOOL_VERSION"

          JAR_NAME="apktool_${APKTOOL_VERSION#v}.jar"

          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/$APKTOOL_VERSION/$JAR_NAME" -O /tmp/apktool.jar

          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /tmp/apktool

          sudo mv /tmp/apktool /usr/local/bin/
          sudo mv /tmp/apktool.jar /usr/local/bin/
          sudo chmod +x /usr/local/bin/apktool

          apktool --version || { echo "apktool command failed"; exit 1; }

      - name: Set Java Heap Size for large APK
        if: ${{ env.SKIP == 'false' }}
        run: echo "JAVA_OPTS=-Xmx6g" >> $GITHUB_ENV

      - name: Create downloads directory
        if: ${{ env.SKIP == 'false' }}
        run: mkdir -p downloads

      - name: Download APK file
        if: ${{ env.SKIP == 'false' }}
        id: download_apk
        run: |
          set -euo pipefail

          if [ -z "${{ env.PIKO_ASSET_URL }}" ] || [ -z "${{ env.PIKO_ASSET_NAME }}" ]; then
            echo "❌ PIKO_ASSET_URL or PIKO_ASSET_NAME is empty."
            echo "apk_downloaded=false" >> "$GITHUB_ENV"
            exit 1
          fi

          OUTPUT_FILE="downloads/${{ env.PIKO_ASSET_NAME }}"

          echo "Downloading: ${{ env.PIKO_ASSET_NAME }}"
          echo "From release: ${{ env.PIKO_RELEASE_TAG }}"
          echo "URL: ${{ env.PIKO_ASSET_URL }}"

          curl -fL --retry 3 --retry-delay 2 \
            "${{ env.PIKO_ASSET_URL }}" \
            -o "$OUTPUT_FILE"

          if [ -s "$OUTPUT_FILE" ]; then
            echo "✅ Downloaded: $OUTPUT_FILE ($(wc -c < "$OUTPUT_FILE") bytes)"
            echo "apk_downloaded=true" >> "$GITHUB_ENV"
          else
            echo "❌ Downloaded APK is empty or missing."
            echo "apk_downloaded=false" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Install APK Framework for Apktool
        if: ${{ env.SKIP == 'false' && env.apk_downloaded == 'true' }}
        run: |
          set -euo pipefail
          APK_FILE="downloads/${{ env.PIKO_ASSET_NAME }}"
          echo "Installing framework from: $APK_FILE"
          apktool if "$APK_FILE"

      - name: Setup Signing Key
        if: ${{ env.SKIP == 'false' && env.apk_downloaded == 'true' }}
        run: |
          echo "Decoding keystore from secrets..."
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > origin-twitter.keystore

      - name: Run Patch APK script
        if: ${{ env.SKIP == 'false' && env.apk_downloaded == 'true' }}
        env:
          STOREPASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          APK_VERSION: ${{ env.APK_VERSION }}
        run: python patch_apk.py

      - name: Run Release APK script
        if: ${{ env.SKIP == 'false' && env.apk_downloaded == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.YuzuMikan404_TOKEN }}
          PIKO_RELEASE_TAG: ${{ env.PIKO_RELEASE_TAG }}
          PIKO_PRERELEASE: ${{ env.PIKO_PRERELEASE }}
          APK_VERSION: ${{ env.APK_VERSION }}
        run: python release_apk.py
